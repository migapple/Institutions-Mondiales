<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Institutions Mondiales</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --ink: #1a1209;
  --gold: #c9a84c;
  --gold2: #e8c96a;
  --parch: #f5edd8;
  --parch2: #ede0c4;
  --cream: #faf6ec;
  --tab-h: 56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#1a1209;}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#1a1209;overflow:hidden;}

/* HEADER */
.header{
  padding-top:calc(14px + env(safe-area-inset-top));
  padding-bottom:10px;
  padding-left:16px;padding-right:16px;
  background:#1a1209;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(201,168,76,0.3);
}
.header-title{
  font-family:Georgia,serif;
  font-size:17px;font-weight:bold;
  color:var(--gold);
  letter-spacing:0.5px;
}
.header-sub{font-size:11px;color:rgba(201,168,76,0.6);font-family:Georgia,serif;margin-top:1px;}
.lang-btn{
  background:none;border:1px solid rgba(201,168,76,0.4);
  border-radius:6px;padding:4px 8px;
  font-size:18px;cursor:pointer;color:var(--gold);
}

/* TABS */
.tabs{
  display:flex;background:#1a1209;
  border-bottom:1px solid rgba(201,168,76,0.25);
  flex-shrink:0;
}
.tab{
  flex:1;padding:10px 0;
  text-align:center;font-size:11px;
  font-family:Georgia,serif;
  color:rgba(201,168,76,0.5);
  cursor:pointer;border:none;background:none;
  letter-spacing:0.3px;display:flex;flex-direction:column;align-items:center;
}
.tab.active{color:var(--gold);border-bottom:2px solid var(--gold);}
.tab-icon{font-size:18px;display:block;margin-bottom:2px;}

/* MAIN */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* MAP */
#map-view{flex:1;display:flex;flex-direction:column;}
#map{flex:1;}
.leaflet-popup-content-wrapper{
  background:#1a1209 !important;border:1px solid var(--gold) !important;
  border-radius:8px !important;color:var(--gold) !important;
}
.leaflet-popup-tip{background:#1a1209 !important;}
.leaflet-popup-content{margin:8px 12px !important;font-family:Georgia,serif;}
.popup-name{font-weight:bold;font-size:13px;color:var(--gold);}
.popup-city{font-size:11px;color:rgba(201,168,76,0.7);margin-top:2px;}
.popup-btn{
  margin-top:6px;background:var(--gold);color:#1a1209;
  border:none;border-radius:5px;padding:4px 10px;
  font-size:11px;font-family:Georgia,serif;cursor:pointer;font-weight:bold;
}

/* LIST */
#list-view{flex:1;overflow-y:auto;padding-bottom:calc(12px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.inst-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-bottom:1px solid rgba(201,168,76,0.12);
  cursor:pointer;
}
.inst-item:active{background:rgba(201,168,76,0.06);}
.inst-logo{
  width:48px;height:48px;border-radius:10px;
  object-fit:cover;background:rgba(201,168,76,0.1);
  flex-shrink:0;border:1px solid rgba(201,168,76,0.2);
}
.inst-logo-placeholder{
  width:48px;height:48px;border-radius:10px;
  background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:22px;
}
.inst-info{flex:1;min-width:0;}
.inst-abbr{font-size:13px;font-weight:bold;color:var(--gold);font-family:Georgia,serif;}
.inst-name{font-size:11px;color:rgba(201,168,76,0.7);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inst-city{font-size:10px;color:rgba(201,168,76,0.45);margin-top:1px;}
.inst-arrow{color:rgba(201,168,76,0.3);font-size:14px;}

/* DETAIL PANEL */
#detail-panel{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:#1a1209;z-index:200;
  transform:translateX(100%);transition:transform 0.3s ease;
  display:flex;flex-direction:column;
}
#detail-panel.open{transform:translateX(0);}
.detail-header{
  padding-top:calc(14px + env(safe-area-inset-top));
  padding-bottom:10px;padding-left:16px;padding-right:16px;
  background:#1a1209;flex-shrink:0;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(201,168,76,0.25);
}
.back-btn{
  background:none;border:none;color:var(--gold);
  font-size:22px;cursor:pointer;padding:0;
}
.detail-header-title{font-family:Georgia,serif;font-size:15px;color:var(--gold);flex:1;}
.detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + env(safe-area-inset-bottom));}

.detail-hero-wrap{
  width:100%;
  border-bottom:1px solid rgba(201,168,76,0.2);
  display:flex;align-items:center;justify-content:center;
  background:rgba(201,168,76,0.04);
  padding:10px 0;
}
.detail-hero{
  max-width:100%;max-height:240px;
  width:auto;height:auto;
  display:block;
  border-radius:4px;
}
.detail-hero-placeholder{
  width:100%;height:200px;background:rgba(201,168,76,0.08);
  display:flex;align-items:center;justify-content:center;
  font-size:60px;border-bottom:1px solid rgba(201,168,76,0.2);
}
.detail-section{padding:16px;}
.detail-abbr{
  font-family:Georgia,serif;font-size:28px;font-weight:bold;
  color:var(--gold);margin-bottom:4px;
}
.detail-fullname{font-family:Georgia,serif;font-size:14px;color:rgba(201,168,76,0.7);margin-bottom:12px;}
.detail-meta{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;
}
.meta-tag{
  background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.25);
  border-radius:12px;padding:3px 10px;font-size:11px;color:var(--gold);
  font-family:Georgia,serif;
}
.detail-desc{
  font-family:Georgia,serif;font-size:14px;
  color:var(--parch);line-height:1.65;
}
.detail-divider{
  height:1px;background:rgba(201,168,76,0.15);
  margin:14px 0;
}
.detail-label{
  font-size:10px;color:rgba(201,168,76,0.5);
  font-family:Georgia,serif;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:6px;
}

/* QUIZ */
#quiz-view{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.quiz-header{
  text-align:center;margin-bottom:20px;
  font-family:Georgia,serif;
}
.quiz-score-label{font-size:11px;color:rgba(201,168,76,0.5);margin-bottom:4px;}
.quiz-score{font-size:28px;font-weight:bold;color:var(--gold);}
.quiz-progress{
  height:4px;background:rgba(201,168,76,0.15);border-radius:2px;margin-bottom:20px;
}
.quiz-progress-bar{height:4px;background:var(--gold);border-radius:2px;transition:width 0.4s;}
.quiz-card{
  background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);
  border-radius:12px;padding:18px;margin-bottom:14px;
}
.quiz-q{font-family:Georgia,serif;font-size:15px;color:var(--parch);margin-bottom:14px;line-height:1.5;}
.quiz-opt{
  display:block;width:100%;text-align:left;
  background:rgba(201,168,76,0.05);border:1px solid rgba(201,168,76,0.2);
  border-radius:8px;padding:10px 14px;margin-bottom:8px;
  font-family:Georgia,serif;font-size:13px;color:var(--parch2);
  cursor:pointer;transition:background 0.15s,border-color 0.15s;
}
.quiz-opt:active{background:rgba(201,168,76,0.15);}
.quiz-opt.correct{background:rgba(80,160,80,0.2)!important;border-color:#5a9 !important;color:#8ec!important;}
.quiz-opt.wrong{background:rgba(160,60,60,0.2)!important;border-color:#a55 !important;color:#e99!important;}
.quiz-feedback{
  margin-top:10px;font-family:Georgia,serif;font-size:13px;
  color:rgba(201,168,76,0.7);line-height:1.4;
}
.quiz-next-btn{
  display:block;width:100%;margin-top:10px;
  background:var(--gold);color:#1a1209;
  border:none;border-radius:8px;padding:12px;
  font-family:Georgia,serif;font-size:14px;font-weight:bold;cursor:pointer;
}
.quiz-restart-btn{
  display:block;width:100%;margin-top:10px;
  background:transparent;color:var(--gold);
  border:1px solid rgba(201,168,76,0.4);border-radius:8px;padding:12px;
  font-family:Georgia,serif;font-size:14px;cursor:pointer;
}

/* SETTINGS */
#settings-panel{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:#1a1209;z-index:300;
  transform:translateX(100%);transition:transform 0.3s ease;
  display:flex;flex-direction:column;
}
#settings-panel.open{transform:translateX(0);}
.settings-header{
  padding-top:calc(14px + env(safe-area-inset-top));
  padding-bottom:10px;padding-left:16px;padding-right:16px;
  background:#1a1209;flex-shrink:0;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(201,168,76,0.25);
}
.settings-body{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.settings-title{font-family:Georgia,serif;font-size:15px;color:var(--gold);}
.apps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
.apps-grid-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.apps-grid-item img{width:56px;height:56px;border-radius:13px;object-fit:cover;}
.apps-grid-item span{font-size:9px;color:rgba(201,168,76,0.6);font-family:Georgia,serif;text-align:center;line-height:1.2;}
.apps-badge{display:block;margin:16px auto 0;height:36px;}
.settings-section-title{font-family:Georgia,serif;font-size:11px;color:rgba(201,168,76,0.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
</style>
</head>

  </div>

  <div class="tabs">
    <button class="tab active" id="tab-list" onclick="showTab('list')">

      <span class="tab-icon">🎯</span><span id="tab-quiz-lbl">Quiz</span>
    </button>
  </div>

  <div class="main">
    <div id="map-view">
      <div id="map"></div>
    </div>
    <div id="list-view" style="display:none;"></div>
    <div id="quiz-view" style="display:none;"></div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div id="detail-panel">

    <button class="back-btn" onclick="closeDetail()">‹</button>

  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<!-- SETTINGS PANEL -->
<div id="settings-panel">

  </div>
  <div class="settings-body">
    <div class="settings-section-title">Catalogue complet</div>

    <img class="apps-badge" src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/fr-fr" alt="App Store">
  </div>
</div>

// ─── LANG ────────────────────────────────────────────────────────────────────
function toggleLang(){
  lang = lang==='fr'?'en':'fr';
  document.getElementById('langBtn').textContent = lang==='fr'?'🇬🇧':'🇫🇷';
  refreshUI();
}
function t(obj){ return obj[lang]||obj['fr']; }

function refreshUI(){
  document.getElementById('tab-map-lbl').textContent = lang==='fr'?'Carte':'Map';
  document.getElementById('tab-list-lbl').textContent = lang==='fr'?'Fiches':'Cards';
  document.getElementById('tab-quiz-lbl').textContent = 'Quiz';
  document.getElementById('h-sub').textContent = lang==='fr'?'17 organisations internationales':'17 international organizations';
  if(currentTab==='list') renderList();
  if(currentTab==='quiz') renderQuiz();

}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function showTab(tab){
  currentTab = tab;
  ['map','list','quiz'].forEach(t=>{
    document.getElementById(t+'-view').style.display = t===tab?'flex':'none';
    if(t==='list'||t==='quiz') document.getElementById(t+'-view').style.display = t===tab?'block':'none';
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  if(tab==='map'){ initMap(); }
  if(tab==='list'){ renderList(); }
  if(tab==='quiz'){ renderQuiz(); }
}

// ─── MAP ──────────────────────────────────────────────────────────────────────
const markers = {};
function initMap(){
  if(map){ updateMapPopups(); return; }
  map = L.map('map',{zoomControl:false}).setView([20, 10], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',maxZoom:18
  }).addTo(map);
  INSTITUTIONS.forEach(inst=>{
    const icon = L.divIcon({
      className:'',
      html:`<div style="font-size:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.5));">${inst.emoji}</div>`,
      iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-14]
    });
    const m = L.marker([inst.lat, inst.lng],{icon}).addTo(map);
    m.bindPopup(makePopupHTML(inst));
    m.on('popupopen',()=>{
      const btn = document.getElementById('popup-btn-'+inst.id);
      if(btn) btn.onclick = ()=>{ m.closePopup(); openDetail(inst); };
    });
    markers[inst.id] = m;
  });
}
function makePopupHTML(inst){
  return `<div class="popup-name">${inst.abbr}</div>
    <div class="popup-city">${t(inst.city)}</div>
    <button class="popup-btn" id="popup-btn-${inst.id}">${lang==='fr'?'Voir la fiche':'See card'}</button>`;
}
function updateMapPopups(){
  if(!map) return;
  INSTITUTIONS.forEach(inst=>{
    if(markers[inst.id]) markers[inst.id].setPopupContent(makePopupHTML(inst));
  });
}

async function loadWikiPhoto(inst){
  if(photoCache[inst.id]){ setDetailHero(inst, photoCache[inst.id]); return; }
  if(!inst.wiki) return;
  try{
    const cap = window.Capacitor;
    const useCapacitor = cap && cap.Plugins && cap.Plugins.CapacitorHttp;

    // Résoudre le titre/fichier
    let apiUrl = null;
    if(inst.wiki.startsWith('wf:')){
      const filename = inst.wiki.slice(3);
      apiUrl = 'https://en.wikipedia.org/w/api.php?action=query&titles=File:'+encodeURIComponent(filename)+'&prop=pageimages&pithumbsize=600&format=json&origin=*';
    } else {
      const title = inst.wiki.startsWith('wt:') ? inst.wiki.slice(3) : inst.wiki;
      apiUrl = 'https://en.wikipedia.org/w/api.php?action=query&titles='+encodeURIComponent(title)+'&prop=pageimages&pithumbsize=600&format=json&origin=*';
    }

    let thumbUrl = null;
    if(useCapacitor){
      const {CapacitorHttp} = cap.Plugins;
      const r1 = await CapacitorHttp.get({url:apiUrl, headers:{'Content-Type':'application/json'}});
      const pg = Object.values(JSON.parse(r1.data).query.pages)[0];
      if(!pg||!pg.thumbnail) return;
      thumbUrl = pg.thumbnail.source;
      const r2 = await CapacitorHttp.get({url:thumbUrl, responseType:'arraybuffer'});
      const b64 = 'data:image/jpeg;base64,'+r2.data;
      photoCache[inst.id] = b64;
      setDetailHero(inst, b64);
    } else {
      // Fallback navigateur : fetch + URL directe (CORS ok sur Wikipedia API)
      const r1 = await fetch(apiUrl);
      const json = await r1.json();
      const pg = Object.values(json.query.pages)[0];
      if(!pg||!pg.thumbnail) return;
      thumbUrl = pg.thumbnail.source;
      // En navigateur on affiche l'URL directement (pas de conversion base64 nécessaire)
      photoCache[inst.id] = thumbUrl;
      setDetailHero(inst, thumbUrl);
    }
  }catch(e){ console.log('photo error', e); }
}

function setDetailHero(inst, src){
  const ph = document.getElementById('hero-placeholder-'+inst.id);
  if(!ph) return;
  const wrap = document.createElement('div');
  wrap.className='detail-hero-wrap';
  const img = document.createElement('img');
  img.className='detail-hero';
  img.src=src;
  img.onerror=()=>{};
  wrap.appendChild(img);
  ph.parentNode.replaceChild(wrap, ph);
}

// ─── QUIZ ────────────────────────────────────────────────────────────────────
function buildQuizQuestions(){
  const all = [];
  INSTITUTIONS.forEach(inst=>{
    // Q1: Où se trouve le siège ?
    const wrongCities = INSTITUTIONS.filter(i=>i.id!==inst.id).map(i=>t(i.hq));
    const shuffled = wrongCities.sort(()=>Math.random()-0.5).slice(0,3);
    const opts1 = [t(inst.hq),...shuffled].sort(()=>Math.random()-0.5);
    all.push({
      q:{fr:`Où se situe le siège de ${inst.abbr} ?`, en:`Where is the headquarters of ${inst.abbr}?`},
      opts:opts1,
      answer:t(inst.hq),
      feedback:{fr:`Le siège de ${inst.abbr} est à ${t(inst.city)}.`,en:`${inst.abbr} is headquartered in ${t(inst.city)}.`}
    });
    // Q2: En quelle année fondée ?
    const wrongYears = [inst.founded-10, inst.founded+5, inst.founded-5].filter(y=>y>1800&&y!==inst.founded);
    const optsY = [String(inst.founded),...wrongYears.slice(0,3).map(String)].sort(()=>Math.random()-0.5);
    all.push({
      q:{fr:`En quelle année ${inst.abbr} a-t-elle été fondée ?`, en:`In what year was ${inst.abbr} founded?`},
      opts:optsY,
      answer:String(inst.founded),
      feedback:{fr:`${inst.abbr} a été fondée en ${inst.founded}.`,en:`${inst.abbr} was founded in ${inst.founded}.`}
    });
    // Q3: Quel est l'acronyme ?
    const wrongAbbrs = INSTITUTIONS.filter(i=>i.id!==inst.id).map(i=>i.abbr).sort(()=>Math.random()-0.5).slice(0,3);
    const optsA = [inst.abbr,...wrongAbbrs].sort(()=>Math.random()-0.5);
    const shortName = t(inst.name).split(' ').slice(0,5).join(' ')+'…';
    all.push({
      q:{fr:`Quel est le sigle de : ${shortName}`, en:`What is the acronym for: ${shortName}`},
      opts:optsA,
      answer:inst.abbr,
      feedback:{fr:`C'est bien ${inst.abbr} – ${t(inst.name)}.`,en:`It is ${inst.abbr} – ${t(inst.name)}.`}
    });
  });
  return all.sort(()=>Math.random()-0.5).slice(0,20);
}

function renderQuiz(){
  if(quizQuestions.length===0) startQuiz();
  const el = document.getElementById('quiz-view');
  const total = quizQuestions.length;
  if(quizIdx>=total){
    el.innerHTML=`
      <div class="quiz-header">
        <div class="quiz-score-label">${lang==='fr'?'Score final':'Final score'}</div>
        <div class="quiz-score">${quizScore}/${total}</div>
        <div style="font-size:32px;margin-top:8px;">${quizScore>=total*0.8?'🏆':quizScore>=total*0.5?'👍':'📚'}</div>
      </div>
      <button class="quiz-next-btn" onclick="startQuiz()">${lang==='fr'?'Rejouer':'Play again'}</button>
    `;
    return;
  }
  const q = quizQuestions[quizIdx];
  el.innerHTML=`
    <div class="quiz-header">
      <div class="quiz-score-label">${lang==='fr'?'Score':'Score'}</div>
      <div class="quiz-score">${quizScore}/${quizIdx}</div>
    </div>
    <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${(quizIdx/total)*100}%"></div></div>
    <div class="quiz-card">
      <div class="quiz-q">${t(q.q)}</div>
      ${q.opts.map((o,i)=>`<button class="quiz-opt" id="qopt-${i}" onclick="answerQuiz('${o.replace(/'/g,"\\'")}',${i})">${o}</button>`).join('')}
      <div class="quiz-feedback" id="quiz-fb" style="display:none;"></div>
      <button class="quiz-next-btn" id="quiz-next" style="display:none;" onclick="nextQuizQ()">${lang==='fr'?'Question suivante':'Next question'} →</button>
    </div>
  `;
}

function startQuiz(){
  quizQuestions = buildQuizQuestions();
  quizIdx=0; quizScore=0; quizAnswered=false;
  renderQuiz();
}

function answerQuiz(chosen, idx){
  if(quizAnswered) return;
  quizAnswered=true;
  const q = quizQuestions[quizIdx];
  const correct = chosen===q.answer;
  if(correct) quizScore++;
  q.opts.forEach((o,i)=>{
    const btn=document.getElementById('qopt-'+i);
    if(!btn) return;
    if(o===q.answer) btn.classList.add('correct');
    else if(i===idx&&!correct) btn.classList.add('wrong');
    btn.disabled=true;
  });
  const fb=document.getElementById('quiz-fb');
  if(fb){fb.textContent=t(q.feedback);fb.style.display='block';}
  const nx=document.getElementById('quiz-next');
  if(nx) nx.style.display='block';
}

function nextQuizQ(){
  quizIdx++;
  quizAnswered=false;
  renderQuiz();
}
